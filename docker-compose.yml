version: '3.9'

services:
  aim-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aim-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"

      # Router (Frontend rule)
      - "traefik.http.routers.aim-app.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.aim-app.entrypoints=websecure"
      - "traefik.http.routers.aim-app.tls.certresolver=myresolver"

      # Service (Backend target inside container)
      - "traefik.http.services.aim-app.loadbalancer.server.port=80"
      - "traefik.http.services.aim-app.loadbalancer.server.scheme=http"

      # Optional: redirect HTTP → HTTPS (for better UX)
      - "traefik.http.routers.aim-app-redirect.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.aim-app-redirect.entrypoints=web"
      - "traefik.http.routers.aim-app-redirect.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  traefik:
    external: true
